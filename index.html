<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="description" content="Maaltijden op basis van de supermarktaanbiedingen van deze week.">
  <title>SlimBord</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script>try { const t = localStorage.getItem("slimbord-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main class="app" id="main" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Hoofdmenu"></nav>
  <script src="app.js"></script>
</body>
</html>
